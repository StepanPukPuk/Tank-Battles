<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Танковый бой</title>
<style>
:root{--bg:#e9e4d6;--fg:#2b2a24;--mut:#5f5c4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f1a;--fg:#e6e3d4;--mut:#a3a18c}}
:root[data-theme="dark"]{--bg:#1d1f1a;--fg:#e6e3d4;--mut:#a3a18c}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
canvas{width:100%;max-width:960px;height:auto;aspect-ratio:8/5;border:3px solid var(--fg);border-radius:6px;touch-action:none;background:#cdb98d}

:root{padding:0!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{padding:0!important;background:#000!important;justify-content:center}
canvas{width:min(100vw,160vh)!important;max-width:none!important;border:0!important;border-radius:0!important}
p{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<p id="help"></p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=960,H=600;
cv.width=W;cv.height=H;
const FONT='"Trebuchet MS",system-ui,sans-serif';
let CR=[],FT=[],state='menu',P,E=[],B=[],F=[],score=0,wave=0,next=0,best=0,sk=0,opts=[];
let pools=[],BI,bt=0,walls=[[200,120,30,140],[730,120,30,140],[200,340,30,140],[730,340,30,140],[420,260,120,80],[330,40,300,24],[330,536,300,24]];
const K={};let mx=W/2,my=0,down=false;
let EM=[],DL=[],flsh=0;

/* ground layer with decals */
const g=document.createElement('canvas');g.width=W;g.height=H;const gx=g.getContext('2d');
(function(){gx.fillStyle='#cdb98d';gx.fillRect(0,0,W,H);
 for(let i=0;i<14;i++){gx.fillStyle='rgba(150,120,70,.08)';gx.beginPath();gx.ellipse(Math.random()*W,Math.random()*H,60+Math.random()*90,30+Math.random()*50,Math.random()*3,0,7);gx.fill()}
 for(let i=0;i<2600;i++){gx.fillStyle=Math.random()<.5?'rgba(140,110,60,.22)':'rgba(255,240,200,.25)';const r=Math.random()*1.6+.4;gx.fillRect(Math.random()*W,Math.random()*H,r,r)}
 const v=gx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);v.addColorStop(0,'rgba(60,45,20,0)');v.addColorStop(1,'rgba(60,45,20,.35)');gx.fillStyle=v;gx.fillRect(0,0,W,H)})();
const rnd=(a,b)=>a+Math.random()*(b-a);
function scorch(x,y,s=1){const R=34*s,q=gx.createRadialGradient(x,y,2,x,y,R);q.addColorStop(0,'rgba(18,12,6,.62)');q.addColorStop(.5,'rgba(30,22,10,.34)');q.addColorStop(1,'rgba(30,22,10,0)');gx.fillStyle=q;gx.beginPath();gx.arc(x,y,R,0,7);gx.fill();
 gx.save();gx.translate(x,y);gx.lineCap='round';
 for(let i=0;i<14;i++){const a=Math.random()*6.28,l=(18+Math.random()*34)*s;gx.strokeStyle='rgba(20,14,8,'+(.1+Math.random()*.14)+')';gx.lineWidth=1+Math.random()*3;gx.beginPath();gx.moveTo(Math.cos(a)*10*s,Math.sin(a)*10*s);gx.lineTo(Math.cos(a)*l,Math.sin(a)*l);gx.stroke()}
 for(let i=0;i<30;i++){const a=Math.random()*6.28,r=Math.random()*R*1.1;gx.fillStyle='rgba(20,14,8,'+Math.random()*.3+')';gx.fillRect(Math.cos(a)*r,Math.sin(a)*r,1+Math.random()*2,1+Math.random()*2)}
 gx.restore()}
function wreck(t,s,pal){gx.save();gx.translate(t.x,t.y);gx.rotate(t.a+rnd(-.2,.2));gx.scale(s,s);
 gx.fillStyle='#1a1815';gx.fillRect(-21,-18,42,9);gx.fillRect(-21,9,42,9);
 gx.fillStyle='#2c2925';for(let i=-19;i<19;i+=6){gx.fillRect(i,-18,2,9);gx.fillRect(i+1,9,2,9)}
 gx.beginPath();gx.moveTo(-19,-12);gx.lineTo(15,-12);gx.lineTo(23,-5);gx.lineTo(23,5);gx.lineTo(15,12);gx.lineTo(-19,12);gx.closePath();
 gx.fillStyle=pal[1];gx.fill();gx.fillStyle='rgba(12,9,6,.74)';gx.fill();gx.strokeStyle='#0d0b09';gx.lineWidth=1.5;gx.stroke();
 gx.save();gx.clip();gx.fillStyle='rgba(0,0,0,.45)';gx.beginPath();gx.ellipse(-4,2,13,8,.3,0,7);gx.fill();gx.fillStyle='rgba(255,255,255,.07)';gx.fillRect(-19,-12,40,3);gx.restore();
 gx.fillStyle='#0f0d0b';gx.beginPath();gx.arc(1,0,8,0,7);gx.fill();gx.strokeStyle='#3a342d';gx.lineWidth=1.5;gx.stroke();
 gx.shadowColor='#ff6a1a';gx.shadowBlur=6;for(let i=0;i<5;i++){gx.fillStyle='rgba(255,'+(90+Math.random()*80|0)+',30,'+(.35+Math.random()*.4)+')';gx.beginPath();gx.arc(rnd(-12,14),rnd(-8,8),rnd(.8,1.8),0,7);gx.fill()}
 gx.restore()}

/* ---------- particle system ---------- */
const SPR={};
function spr(c){let s=SPR[c];if(!s){s=document.createElement('canvas');s.width=s.height=64;const x=s.getContext('2d'),q=x.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,c+'ff');q.addColorStop(.3,c+'bb');q.addColorStop(.65,c+'33');q.addColorStop(1,c+'00');x.fillStyle=q;x.fillRect(0,0,64,64);SPR[c]=s}return s}
function fx(o){if(F.length>(o.k?1400:850))return;o.m=o.l;o.vx=o.vx||0;o.vy=o.vy||0;o.fr=o.fr||.96;o.g=o.g||0;o.a=o.a==null?1:o.a;o.z=o.z==null?1:o.z;o.ro=o.ro||0;if(o.c0&&!o.c1)o.c1=o.c0;F.push(o)}
function updFx(){const n=F.length;
 for(let i=0;i<n;i++){const f=F[i];f.x+=f.vx;f.y+=f.vy;f.vx*=f.fr;f.vy*=f.fr;if(f.wx){f.vx+=f.wx;f.vy+=f.wy}if(f.rv){f.ro+=f.rv;if(f.k==='cs')f.rv*=.95}f.l--;
  if(f.tr&&f.l>10&&Math.random()<f.tr)fx({x:f.x,y:f.y,vx:rnd(-.2,.2),vy:rnd(-.2,.2),l:rnd(16,28),r:f.r*.55,g:.12,c0:'#ffa030',c1:'#35322d',a:.55,wx:.008,wy:-.006,fr:.9,z:1})}
 F=F.filter(f=>f.l>0)}
function updEm(){for(const e of EM){e.l--;const u=e.l/e.m;
  if(e.l%3===0)fx({x:e.x+rnd(-9,9)*e.s,y:e.y+rnd(-7,7)*e.s,vx:rnd(-.12,.12),vy:rnd(-.35,-.1),l:rnd(60,100),r:rnd(5,8)*e.s,g:.15,c0:'#1e1c1a',c1:'#77726a',a:.18+.3*u,wx:.012,wy:-.008,fr:.97,z:1});
  if(u>.5&&Math.random()<.14)fx({x:e.x+rnd(-10,10)*e.s,y:e.y+rnd(-8,8)*e.s,vx:rnd(-.1,.1),vy:rnd(-.3,-.05),l:rnd(10,18),r:rnd(4,7)*e.s,g:.1,c0:'#ffb838',c1:'#c8300a',a:.6,fr:.95,z:1})}
 EM=EM.filter(e=>e.l>0)}
function later(n,fn){DL.push([n,fn])}
function updDL(){for(const q of DL)q[0]--;const due=DL.filter(q=>q[0]<=0);DL=DL.filter(q=>q[0]>0);for(const q of due)q[1]()}
function lobe(an,len,w){ctx.save();ctx.rotate(an);const g=ctx.createLinearGradient(0,0,len,0);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,238,160,.95)');g.addColorStop(.65,'rgba(255,150,40,.7)');g.addColorStop(1,'rgba(255,80,10,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-3,0);ctx.quadraticCurveTo(len*.3,-w,len,0);ctx.quadraticCurveTo(len*.3,w,-3,0);ctx.fill();ctx.restore()}
function dbShape(f){const r=f.r;ctx.beginPath();
 if(f.sh==='tur'){ctx.ellipse(0,0,r,r*.85,0,0,7);ctx.rect(0,-r*.14,r*1.9,r*.28)}
 else{ctx.moveTo(-r,-r*.6);ctx.lineTo(r*.8,-r*.9);ctx.lineTo(r,r*.5);ctx.lineTo(-r*.7,r*.8);ctx.closePath()}}
function drawFx(z){
 for(const f of F){if(f.z!==z)continue;const u=1-f.l/f.m,k=f.k;
  if(!k){const al=f.a*Math.min(1,.3+u*8)*(1-u);if(al<.01)continue;const r=f.r+f.g*(f.m-f.l);
   ctx.globalCompositeOperation=f.add?'lighter':'source-over';
   if(f.c0===f.c1){ctx.globalAlpha=Math.min(1,al);ctx.drawImage(spr(f.c0),f.x-r,f.y-r,r*2,r*2)}
   else{const w=Math.min(1,Math.pow(u,.8)*1.15);ctx.globalAlpha=Math.min(1,al*(1-w*.5));ctx.drawImage(spr(f.c0),f.x-r,f.y-r,r*2,r*2);ctx.globalAlpha=Math.min(1,al*w);ctx.drawImage(spr(f.c1),f.x-r,f.y-r,r*2,r*2)}}
  else if(k==='sp'){ctx.globalCompositeOperation=f.add?'lighter':'source-over';ctx.globalAlpha=Math.min(1,(1-u)*1.3);ctx.strokeStyle=f.c0;ctx.lineWidth=f.w*(1-u*.5);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx*f.len,f.y-f.vy*f.len);ctx.stroke()}
  else if(k==='rg'){const r=f.r+f.g*(f.m-f.l);ctx.globalCompositeOperation=f.add?'lighter':'source-over';ctx.globalAlpha=Math.max(0,f.a*(1-u)*(1-u));ctx.strokeStyle=f.c0;ctx.lineWidth=Math.max(.5,f.w*(1-u));ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.stroke()}
  else if(k==='fl'){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1-u*.5;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.an);const q=1-u*.55,len=f.len*q,w=f.w*(1-u*.4);
   lobe(0,len,w);lobe(.5,len*.55,w*.7);lobe(-.5,len*.55,w*.7);lobe(2.7,len*.3,w*.6);lobe(-2.7,len*.3,w*.6);ctx.restore()}
  else if(k==='db'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(1,(1-u)*3.2);
   ctx.save();ctx.translate(f.x+3,f.y+4);ctx.rotate(f.ro);ctx.fillStyle='rgba(0,0,0,.2)';dbShape(f);ctx.fill();ctx.restore();
   ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.ro);ctx.fillStyle=f.c0;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;dbShape(f);ctx.fill();ctx.stroke();ctx.restore();
   if(f.hot&&u<.6){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-u/.6)*.55;ctx.drawImage(spr('#ff8a2a'),f.x-f.r*2,f.y-f.r*2,f.r*4,f.r*4)}}
  else if(k==='cs'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(1,(1-u)*3);ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.ro);ctx.fillStyle=f.c0;ctx.fillRect(-3,-1.3,6,2.6);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(-3,-1.3,6,.8);ctx.restore()}}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function flame(x,y,len,w,hot){ctx.save();ctx.globalCompositeOperation='lighter';
 const g=ctx.createLinearGradient(x,0,x-len,0);g.addColorStop(0,hot?'rgba(170,225,255,.95)':'rgba(255,245,200,.95)');g.addColorStop(.3,'rgba(255,170,50,.8)');g.addColorStop(1,'rgba(255,70,10,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y-w);ctx.quadraticCurveTo(x-len*.5,y-w*.9,x-len,y);ctx.quadraticCurveTo(x-len*.5,y+w*.9,x,y+w);ctx.closePath();ctx.fill();
 if(hot){ctx.fillStyle='rgba(200,235,255,.8)';for(let i=0;i<2;i++){ctx.beginPath();ctx.ellipse(x-len*(.3+i*.28),y,Math.max(.5,len*.09),w*.45,0,0,7);ctx.fill()}}
 const h=ctx.createRadialGradient(x,y,0,x,y,w*3.2);h.addColorStop(0,'rgba(255,170,70,.45)');h.addColorStop(1,'rgba(255,170,70,0)');ctx.fillStyle=h;ctx.fillRect(x-w*3.2,y-w*3.2,w*6.4,w*6.4);ctx.restore()}
function hitGlow(t,s){if(t.hf>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,t.hf/8)*.5;ctx.drawImage(spr('#ffe0a0'),t.x-36*s,t.y-36*s,72*s,72*s);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}}
function flashOv(){if(flsh>.02){ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,170,80,'+Math.min(.4,flsh*.4)+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}flsh*=.88}

/* ---------- shells ---------- */
function drawBullet(b){const own=b.own,hot=own&&(b.bounce>0||L('ric')>0),
 rgb=own?(hot?'255,140,40':'255,196,70'):'255,70,40',glow=own?(hot?'#ff9a3c':'#ffd36b'):'#ff5a3a',core=own?'#fffbe6':'#ffe2d2',
 ang=Math.atan2(b.vy,b.vx),tr=b.tr||[],n=tr.length/2,X=i=>i<n?tr[i*2]:b.x,Y=i=>i<n?tr[i*2+1]:b.y;
 ctx.fillStyle='rgba(50,35,10,.18)';ctx.beginPath();ctx.ellipse(b.x+4,b.y+8,4+b.r,2+b.r*.5,ang,0,7);ctx.fill();
 ctx.lineCap='round';
 for(let i=1;i<=n;i++){const u=i/n;ctx.strokeStyle='rgba('+rgb+','+(.12+u*.6)+')';ctx.lineWidth=.8+b.r*2.4*u;ctx.beginPath();ctx.moveTo(X(i-1),Y(i-1));ctx.lineTo(X(i),Y(i));ctx.stroke()}
 ctx.globalCompositeOperation='lighter';
 for(let i=Math.max(1,n-6);i<=n;i++){const u=i/n;ctx.strokeStyle='rgba(255,250,220,'+(u*.8)+')';ctx.lineWidth=.5+b.r*.9*u;ctx.beginPath();ctx.moveTo(X(i-1),Y(i-1));ctx.lineTo(X(i),Y(i));ctx.stroke()}
 ctx.globalAlpha=.6;ctx.drawImage(spr(glow),b.x-b.r*6,b.y-b.r*6,b.r*12,b.r*12);ctx.globalAlpha=.22;ctx.drawImage(spr(glow),b.x-b.r*15,b.y-b.r*15,b.r*30,b.r*30);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);const Ln=6+b.r*1.8,w=b.r*.8+.8;
 ctx.beginPath();ctx.moveTo(Ln*.6,0);ctx.quadraticCurveTo(Ln*.2,-w*1.15,-Ln*.4,-w*.85);ctx.lineTo(-Ln*.4,w*.85);ctx.quadraticCurveTo(Ln*.2,w*1.15,Ln*.6,0);
 ctx.fillStyle=core;ctx.fill();ctx.strokeStyle='rgba(90,40,0,.7)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle=glow;ctx.fillRect(-Ln*.4,-w*.85,Ln*.22,w*1.7);ctx.restore()}

/* ---------- shot / hit / explosion effects ---------- */
function boom(x,y,n,c){fx({x,y,l:10,r:16,g:1.1,c0:c,c1:c,add:1,a:.7,z:1});fx({k:'rg',x,y,r:6,g:2.2,l:16,c0:c,w:2.5,add:1,a:.8,fr:1,z:1});
 for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(.8,4);fx({k:'sp',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(14,28),fr:.92,c0:c,w:1.8,len:2.2,add:1,z:1})}
 for(let i=0;i<Math.ceil(n/3);i++){const a=Math.random()*6.28,v=rnd(.3,1.6);fx({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.2,l:rnd(24,40),r:rnd(2,4),g:-.03,c0:c,c1:c,add:1,a:.8,fr:.95,z:1})}}
function flash(x,y,a,big){big=big||1;const c=Math.cos(a),s=Math.sin(a);
 fx({x,y,l:10,r:28*big,g:.6,c0:'#ffa030',c1:'#ff6a1a',a:.5,z:1});
 fx({x,y,l:9,r:30*big,g:.5,c0:'#ffd27a',c1:'#ff8a2a',add:1,a:.55,z:1});
 fx({x:x+c*5,y:y+s*5,l:5,r:11*big,g:.7,c0:'#ffffff',c1:'#ffe9a8',add:1,a:1,z:1});
 fx({k:'fl',x,y,an:a,len:38*big,w:7.5*big,l:6,fr:1,z:1});
 fx({k:'rg',x,y,r:5,g:2.6*big,l:12,c0:'#fff2c0',w:2.4,add:1,a:.6,fr:1,z:1});
 for(let i=0;i<10;i++){const b=a+rnd(-.38,.38),v=rnd(4,11)*big;fx({k:'sp',x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,l:rnd(8,17),fr:.88,c0:i%2?'#fff1b0':'#ffae2a',w:1.7,len:2.3,z:1})}
 for(let i=0;i<7;i++){const b=a+rnd(-.5,.5),v=rnd(.9,2.8)*big;fx({x:x+c*6,y:y+s*6,vx:Math.cos(b)*v,vy:Math.sin(b)*v,l:rnd(30,52),r:rnd(3,6)*big,g:.22,c0:'#ddd7c4',c1:'#8c877a',a:.5,wx:.01,wy:-.008,fr:.94,z:1})}
 for(let i=0;i<4;i++){const b=a+(i%2?1.57:-1.57)+rnd(-.4,.4),v=rnd(.6,1.6);fx({x:x-c*14,y:y-s*14,vx:Math.cos(b)*v,vy:Math.sin(b)*v,l:rnd(24,36),r:rnd(4,7)*big,g:.18,c0:BI.du,c1:BI.du,a:.3,fr:.93,z:0})}}
function casing(x,y,a){fx({k:'cs',x:x+Math.cos(a)*6,y:y+Math.sin(a)*6,vx:Math.cos(a+1.4)*rnd(2,3.2)-Math.cos(a)*.5,vy:Math.sin(a+1.4)*rnd(2,3.2)-Math.sin(a)*.5,l:46,fr:.9,ro:rnd(0,6),rv:rnd(.3,.6),c0:'#e0b64a',z:1})}
function hitFx(x,y,ang){const back=ang+Math.PI;
 fx({x,y,l:9,r:24,g:.9,c0:'#ffffff',c1:'#ffb347',add:1,a:.95,z:1});
 fx({x,y,l:16,r:10,g:.7,c0:'#ffb838',c1:'#c8300a',a:.8,z:1});
 fx({k:'rg',x,y,r:4,g:2.8,l:13,c0:'#ffd27a',w:2.6,add:1,a:.95,fr:1,z:1});
 for(let i=0;i<16;i++){const b=back+rnd(-1,1)*.95,v=rnd(2,8.5);fx({k:'sp',x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,l:rnd(10,24),fr:.9,c0:i%3?'#ffc23a':'#ffffff',w:1.5,len:2.4,z:1})}
 for(let i=0;i<5;i++){const b=back+rnd(-1.4,1.4),v=rnd(1.5,5);fx({k:'db',x,y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,r:rnd(1.3,2.6),c0:i%2?'#2e2e28':'#58584a',l:rnd(18,32),fr:.9,ro:rnd(0,6),rv:rnd(-.5,.5),hot:1,z:1})}
 for(let i=0;i<3;i++)fx({x,y,vx:rnd(-.5,.5),vy:rnd(-.7,-.1),l:rnd(30,46),r:rnd(4,6),g:.2,c0:'#3a3733',c1:'#8a857a',a:.5,wx:.01,wy:-.008,fr:.94,z:1})}
function wallFx(x,y,ang){const back=ang+Math.PI;
 fx({x,y,l:7,r:14,g:.8,c0:'#fff0c0',c1:'#ffb347',add:1,a:.7,z:1});
